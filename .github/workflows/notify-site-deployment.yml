name: Notify landing site to deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify_site:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full-site deployment
        env:
          GH_TOKEN: ${{ secrets.SITE_DEPLOY_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "SITE_DEPLOY_DISPATCH_TOKEN is not configured." >&2
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --url https://api.github.com/repos/mollman/AppliedHyperkinetics.Web/dispatches \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"event_type":"project-updated"}'
